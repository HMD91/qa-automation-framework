name: QA Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality - Ruff
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code quality with Ruff
        run: ruff check .

  tests:
    name: Automated Tests - Pytest
    runs-on: ubuntu-24.04

    env:
      API_BASE_URL: https://jsonplaceholder.typicode.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      - name: Install Node dependencies
        run: npm ci

      - name: Run Pytest
        run: pytest

      - name: Generate Allure Report
        if: always() && hashFiles('reports/allure-results/**') != ''
        run: npx allure generate reports/allure-results --clean --output reports/allure-report

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            reports/report.html
            reports/allure-report/
          retention-days: 7
          if-no-files-found: warn
