[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-automation-framework"
version = "0.1.0"
description = "Professional QA Automation Framework using Python, Pytest and Playwright"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "playwright",
    "pydantic",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-playwright",
    "pytest-html",
    "allure-pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --html=reports/report.html --self-contained-html --alluredir=reports/allure-results --clean-alluredir"
markers = [
    "api: tests de validation des API",
    "ui: tests de validation de l'interface utilisateur",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "framework*"]
exclude = ["tests*", "test_data*", "reports*"]
